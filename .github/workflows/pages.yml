name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required configuration
        env:
          LEAD_ENDPOINT: ${{ secrets.LEAD_ENDPOINT }}
        run: |
          if [ -z "$LEAD_ENDPOINT" ]; then
            echo "::error::Repository secret LEAD_ENDPOINT is not configured."
            exit 1
          fi
          if ! printf '%s' "$LEAD_ENDPOINT" | grep -Eq '^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$'; then
            echo "::error::LEAD_ENDPOINT is not a valid Google Apps Script /exec URL."
            exit 1
          fi

      - name: Build production site
        env:
          LEAD_ENDPOINT: ${{ secrets.LEAD_ENDPOINT }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
