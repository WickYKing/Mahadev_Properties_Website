name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source images
        run: |
          echo "Checking public/assets..."
          ls -la public || true
          ls -la public/assets || true

          test -f public/assets/logo.webp || {
            echo "::error::public/assets/logo.webp is missing"
            exit 1
          }

      - name: Validate configuration
        env:
          LEAD_ENDPOINT: ${{ secrets.LEAD_ENDPOINT }}
        run: |
          if [ -z "$LEAD_ENDPOINT" ]; then
            echo "::error::LEAD_ENDPOINT secret is missing."
            exit 1
          fi

      - name: Build production website
        env:
          LEAD_ENDPOINT: ${{ secrets.LEAD_ENDPOINT }}
        run: npm run build

      - name: Ensure static images are deployed
        run: |
          mkdir -p dist/assets

          cp -a public/assets/. dist/assets/

          if [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          fi

          echo "Production assets:"
          ls -lah dist/assets/

      - name: Verify logo exists in production
        run: |
          test -f dist/assets/logo.webp || {
            echo "::error::dist/assets/logo.webp was not created"
            exit 1
          }

          test -s dist/assets/logo.webp || {
            echo "::error::dist/assets/logo.webp is empty"
            exit 1
          }

          echo "Logo verified successfully."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
