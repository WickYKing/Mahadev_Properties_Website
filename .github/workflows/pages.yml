name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean production site
        run: |
          rm -rf dist
          mkdir -p dist

          cp *.html dist/
          cp CNAME dist/
          cp robots.txt dist/
          cp sitemap.xml dist/
          cp .nojekyll dist/ || true
          cp -a assets dist/assets

          echo "Checking for standalone source files..."
          if find dist -type f \( -name "*.css" -o -name "*.js" -o -name "*.gs" -o -name "*.cmd" -o -name "*.mjs" \) | grep -q .; then
            echo "::error::Standalone source file found in production output"
            find dist -type f
            exit 1
          fi

          echo "Production files:"
          find dist -maxdepth 2 -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
